[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# HTTP framework & runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "cors",
  "set-header",
  "trace",
  "normalize-path",
] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# GraphQL (future -- Phase 4)
# async-graphql = "7"
# async-graphql-axum = "7"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Hashing & encoding
sha2 = "0.10"
hex = "0.4"

# BigInt
num-bigint = "0.4"

# HTTP types
bytes = "1"
http = "1"

# Chrono for datetime
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Content type detection & base64 encoding
infer = "0.19"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp = "0.3"

# Ethereum / signing
alloy = { version = "1.7.3", features = ["full"] }
alloy-signer-local = { version = "1.7.3", features = ["mnemonic"] }
